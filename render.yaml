services:
  - type: web
    name: tempoalerta-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev
    startCommand: npm start
    healthCheckPath: /api/saude
    envVars:
      - key: NODE_VERSION
        value: 24.14.0
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://tempoalerta-web.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        value: TempoAlertaBot
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_BUSINESS_NUMBER
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_TEMPLATE_NAME
        sync: false
      - key: WHATSAPP_TEMPLATE_LANGUAGE
        value: pt_BR
      - key: WHATSAPP_GRAPH_API_VERSION
        value: v23.0
      - key: SCHEDULER
        value: on
      - key: MAIL_MODE
        value: off
