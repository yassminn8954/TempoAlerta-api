services:
  - type: web
    name: tempoalerta-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev
    startCommand: npm start
    healthCheckPath: /api/saude
    envVars:
      - key: NODE_VERSION
        value: 24.14.0
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://tempoalerta-web.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        value: TempoAlertaBot
      - key: SCHEDULER
        value: on
